name: PR checks
on:
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: make check
        run: make check
      - name: govulncheck
        run: make vuln

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Docker/Dockerfile
          push: false
          load: true
          tags: bob:ci
          cache-from: type=gha,scope=bob-ci
          cache-to: type=gha,scope=bob-ci,mode=max
      - name: Smoke test container
        run: |
          set -euo pipefail
          container=bob-ci-smoke
          trap 'timeout 10s docker logs "$container" || true; timeout 10s docker rm -f "$container"' EXIT
          timeout 30s docker run --name "$container" -d -p 127.0.0.1::3000 bob:ci
          port="$(docker port "$container" 3000/tcp | head -n1 | cut -d: -f2)"
          # Poll the served routes directly instead of waiting on the image
          # HEALTHCHECK, whose first probe only runs after its 30s interval.
          ready=false
          for _ in {1..20}; do
            if curl --fail --silent --max-time 2 "http://127.0.0.1:${port}/ready" -o /dev/null \
              && curl --fail --silent --max-time 2 "http://127.0.0.1:${port}/" -o /dev/null; then
              ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker inspect --format '{{json .State}}' "$container"
            echo "Container did not serve /ready and / with 200 within 20 seconds" >&2
            exit 1
          fi
          for route in /health /healthz /status /projects /projects/bitofbytes /static/styles.css; do
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${port}${route}" -o /dev/null
          done
